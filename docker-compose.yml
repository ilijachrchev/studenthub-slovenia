services:
  db:
    image: mysql:8.0
    container_name: studenthub-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: SISIII2026_89241041
      MYSQL_USER: studenti
      MYSQL_PASSWORD: studentipass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 10

  db-pg:
    image: postgres:16
    container_name: studenthub-postgres
    environment:
      POSTGRES_DB: SISIII2026_89241041
      POSTGRES_USER: studenti
      POSTGRES_PASSWORD: studentipass
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studenti -d SISIII2026_89241041"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    container_name: studenthub-backend
    ports:
      - "30011:30011"
    environment:
      DB_CLIENT: pg
      DB_HOST: db-pg
      DB_USER: studenti
      DB_PASSWORD: studentipass
      DB_DATABASE: SISIII2026_89241041
      DB_PORT: 5432
      SESSION_SECRET: dev-session-secret-change-in-production
      FRONTEND_URL: http://localhost:30010
      PORT: 30011
    depends_on:
      db-pg:
        condition: service_healthy

volumes:
  mysql_data:
  postgres_data: